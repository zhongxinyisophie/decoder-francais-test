<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>解码法语听力 · L’IA à l’école</title>
<style>

.seekrow{display:flex;align-items:center;gap:9px;margin-top:10px}.seek{width:100%;height:3px;accent-color:var(--accent);cursor:pointer}.timecode{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:62px;text-align:right}

@media(max-width:430px){.diagnostic{grid-template-columns:1fr}.miniplayer{gap:8px}.speedseg{margin-left:0}.timecode{min-width:58px}}

.relationpanel{margin-top:14px;padding:17px;background:#f0eee8;border:1px solid var(--line);border-radius:18px;scroll-margin-top:18px}.relationhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.relationhead h3{font-size:20px;margin-top:3px}.relationclose{appearance:none;border:0;background:transparent;color:var(--muted);font-size:25px;line-height:1;cursor:pointer;padding:1px 5px}.relationintro{margin:7px 0 13px}.relationgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.relationcard{appearance:none;width:100%;border:1px solid var(--line);background:#f8f7f3;border-radius:13px;padding:12px;text-align:left;color:var(--text);font:inherit}.relationcard.available{background:#fff;cursor:pointer;border-color:#cddfd7}.relationcard.available:active{transform:scale(.995)}.relationtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.relationtop b{display:block;font-size:14px}.relationtop small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.relationcard p{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 0 0}.relationcta{display:block;color:var(--accent);font-size:11px;font-weight:800;margin-top:9px}
@media(max-width:560px){.relationgrid{grid-template-columns:1fr}}

.relationprofile{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.relationprofilehead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.relationprofilehead small{color:var(--muted)}.relationprofilerow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eeeae2}.relationprofilerow:last-child{border-bottom:0}.relationprofiletop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.relationprofiletop b{font-size:13px}.relationprofiletop span{font-size:10px;padding:3px 6px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:800}.relationprofilerow small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.relationprofilerow button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:9px;padding:6px 8px;font-size:11px;font-weight:750;white-space:nowrap;cursor:pointer}

.taskhero{padding:34px 4px 18px;text-align:left}.taskhero h1{max-width:560px;margin-top:5px}.taskhero p{max-width:520px;margin:10px 0 20px}.primarycta{display:block;width:100%;max-width:360px;padding:14px 18px;font-size:16px;text-align:center;border-radius:14px}.herometa{font-size:12px;color:var(--muted);margin-top:9px}
.quicknav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 24px}.quicknav button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:13px;padding:12px 11px;text-align:left;color:var(--text);cursor:pointer}.quicknav button.active{border-color:#b9d2c8;background:var(--soft)}.quicknav b{display:block;font-size:14px}.quicknav small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.35}
.homeSection{margin-top:18px;scroll-margin-top:14px}.sectionclose{appearance:none;border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;padding:2px 4px;cursor:pointer}.sectionintro{margin:5px 0 10px}.homeSection .sectionhead{align-items:flex-start}
@media(max-width:560px){.quicknav{grid-template-columns:repeat(3,1fr);gap:6px}.quicknav button{padding:10px 8px}.quicknav b{font-size:13px}.quicknav small{font-size:10px}.taskhero{padding-top:26px}.primarycta{max-width:none}}

.resultmain{padding:20px}.resultheadline{margin:16px 0;padding:14px 15px;border-radius:14px;background:var(--soft)}.resultheadline b{font-size:17px;color:var(--accent)}.resultheadline p{margin:6px 0 0;color:var(--muted);line-height:1.5}.nextstep{margin:18px 0 10px;padding:16px;border:1px solid #cddfd7;border-radius:15px;background:#fbfdfc}.nextstep small{color:var(--accent);font-weight:800}.nextstep h3{font-size:20px;margin:4px 0 6px}.nextstep p{margin:0 0 13px;color:var(--muted);line-height:1.5}.resultdetails{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.resultdetails summary{font-size:13px}.resultdetailsbody{padding-top:8px}
</style></head><body><div class="app">
<div class="top"><div class="brand">解码法语</div><div class="badge" id="lessonBadge">B1–B2 · 中文母语者</div></div>
<section id="home">
  <div class="hero producthero taskhero">
    <div class="pill">Décoder le français</div>
    <h1>听懂法语，先找出为什么没听出来。</h1>
    <p class="muted">用真实法语音频，找出你卡在声音、词义、结构还是逻辑。</p>
    <button type="button" class="btn primarycta" data-start-recommended>开始今天的训练</button>
    <div class="herometa">B1–B2 · 约 10 分钟</div>
  </div>

  <nav class="quicknav" aria-label="首页功能">
    <button type="button" data-home-panel="skillsSection"><b>专项训练</b><small>集中练一个难点</small></button>
    <button type="button" data-home-panel="materialsSection"><b>听力素材</b><small>自己选择内容</small></button>
    <button type="button" data-home-panel="profileSection"><b>我的听力</b><small>查看听力分析</small></button>
  </nav>

  <div class="homeSection hidden" id="skillsSection">
    <div class="sectionhead">
      <div><small class="eyebrow">专项训练</small><h2>你想练哪一项？</h2></div>
      <button type="button" class="sectionclose" data-close-home-panel aria-label="关闭">×</button>
    </div>
    <p class="muted sectionintro">选择一个最容易卡住的地方集中练习。</p>
    <div class="skillLibrary" id="skillLibrary"></div>
    <div id="relationPanel" class="relationpanel hidden"></div>
  </div>

  <div class="homeSection hidden" id="materialsSection">
    <div class="sectionhead">
      <div><small class="eyebrow">听力素材</small><h2>选择一段开始</h2></div>
      <button type="button" class="sectionclose" data-close-home-panel aria-label="关闭">×</button>
    </div>
    <div id="materialLibrary"></div>
  </div>

  <div class="homeSection hidden" id="profileSection">
    <div class="sectionhead">
      <div><small class="eyebrow">我的听力</small><h2>听力分析</h2></div>
      <button type="button" class="sectionclose" data-close-home-panel aria-label="关闭">×</button>
    </div>
    <div class="profilehome" id="profileHome"></div>
  </div>
</section>
<section id="lesson" class="hidden"><div class="stephead"><div><small id="lessonName" style="color:var(--accent)">L’IA à l’école</small><h2 id="title"></h2></div><small id="count"></small></div><div class="progress"><i id="bar"></i></div><div id="content"></div><div class="btnrow"><button class="btn secondary" id="prevBtn">上一步</button><button class="btn" id="nextBtn">下一步</button><button class="btn hidden" id="finishBtn">完成本次训练</button><button class="mini" id="homeBtn">退出</button></div></section>
<section id="result" class="hidden">
  <div class="stephead"><div><small id="resultLessonName" style="color:var(--accent)">L’IA à l’école</small><h2>本次训练完成</h2></div></div>
  <div id="resultContent"></div>
  <div class="btnrow"><button class="btn secondary" id="restartBtn">重新练习</button><button class="btn" id="resultHomeBtn">返回首页</button></div>
</section></div>
<button type="button" id="backToTop" class="backtotop" aria-label="回到顶部">↑ 回到顶部</button>
<script src="data/catalog.js?v=3"></script>
<script src="app-v13.js"></script>
</body></html>
