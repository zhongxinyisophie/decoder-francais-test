<style>

t)}.mini{padding:7px 10px;font-size:12px}.hidden{display:none}.stephead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.progress{height:6px;background:#e4e0d8;border-radius:99px;margin:10px 0 16px;overflow:hidden}.progress i{height:100%;display:block;background:var(--accent);width:0}.scale{display:flex;gap:6px}.scale button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 2px}.scale button.sel{background:var(--accent);color:#fff}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}details{margin-top:12px}summary{cursor:pointer;color:var(--accent);font-weight:700}.jumpgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.jump{text-align:center}.compare{display:flex;justify-content:space-around;align-items:center;background:var(--soft);padding:14px;border-radius:14px;margin-top:14px}.compare b{font-size:25px}.pill{display:inline-block;background:var(--soft);color:var(--accent);font-size:12px;padding:5px 8px;border-radius:99px;margin-bottom:8px}@media(max-width:430px){.jumpgrid{grid-template-columns:1fr}}
